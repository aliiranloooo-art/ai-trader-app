<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trader</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
body{background:#0a0e17;color:#fff;padding:15px;min-height:100vh}
.container{max-width:500px;margin:0 auto}
h1{color:#4ade80;text-align:center;margin-bottom:5px;font-size:22px}
.subtitle{text-align:center;color:#888;font-size:12px;margin-bottom:20px}
.api-input{width:100%;padding:12px;background:#1a1f2e;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:12px;font-size:13px}
.api-input:focus{outline:none;border-color:#4ade80}
.upload-box{border:2px dashed #4ade80;border-radius:15px;padding:30px 15px;text-align:center;cursor:pointer;margin-bottom:15px;transition:all .3s}
.upload-box:hover{background:rgba(74,222,128,.1)}
.upload-box input{display:none}
.upload-icon{font-size:42px;margin-bottom:8px}
.upload-text{color:#4ade80;font-size:13px}
.preview{margin-bottom:12px}
.preview img{width:100%;border-radius:10px}
.btn{width:100%;padding:14px;background:#4ade80;color:#0a0e17;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;transition:all .3s}
.btn:hover:not(:disabled){background:#22c55e}
.btn:disabled{background:#333;color:#666;cursor:not-allowed}
.loading{text-align:center;padding:15px;color:#4ade80;display:none;font-size:13px}
.loading.show{display:block}
.spinner{border:4px solid #1a1f2e;border-top:4px solid #4ade80;border-radius:50%;width:35px;height:35px;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.result{margin-top:15px;padding:18px;background:#1a1f2e;border-radius:15px;border:1px solid #4ade80;display:none}
.result.show{display:block}
.signal{text-align:center;font-size:24px;font-weight:bold;margin-bottom:12px}
.signal.buy{color:#4ade80}
.signal.sell{color:#ef4444}
.signal.no-trade{color:#fbbf24}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #2a2f3e;font-size:13px}
.row:last-child{border-bottom:none}
.label{color:#888}
.value{color:#fff;font-weight:bold}
.error{margin-top:12px;padding:12px;background:#7f1d1d;border-radius:10px;color:#fecaca;font-size:12px;display:none}
.error.show{display:block}
.note{font-size:11px;color:#666;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="container">
<h1>🤖 AI Trader</h1>
<p class="subtitle">تحلیل چارت با هوش مصنوعی</p>

<input type="password" id="apiKey" class="api-input" placeholder="Gemini API Key" />

<div class="upload-box" onclick="document.getElementById('fileInput').click()">
<div class="upload-icon">📸</div>
<div class="upload-text">اسکرین‌شات چارت را آپلود کنید</div>
<input type="file" id="fileInput" accept="image/*" />
</div>

<div class="preview" id="preview"></div>

<button class="btn" id="analyzeBtn" disabled>تحلیل کن</button>

<div class="loading" id="loading">
<div class="spinner"></div>
<div>در حال تحلیل... لطفاً صبر کنید</div>
</div>

<div class="error" id="error"></div>

<div class="result" id="result">
<div class="signal" id="signal"></div>
<div class="row"><span class="label">ورود:</span><span class="value" id="entry">-</span></div>
<div class="row"><span class="label">استاپ‌لاس:</span><span class="value" id="stopLoss">-</span></div>
<div class="row"><span class="label">حد سود:</span><span class="value" id="takeProfit">-</span></div>
<div class="row"><span class="label">اطمینان:</span><span class="value" id="confidence">-</span></div>
<div class="row"><span class="label">دلیل:</span><span class="value" id="reason">-</span></div>
</div>

<p class="note">⚠️ این ابزار فقط تحلیل می‌دهد. تصمیم نهایی با شماست.</p>
</div>

<script>
const fileInput=document.getElementById('fileInput');
const preview=document.getElementById('preview');
const analyzeBtn=document.getElementById('analyzeBtn');
const loading=document.getElementById('loading');
const result=document.getElementById('result');
const errorBox=document.getElementById('error');
const apiKeyInput=document.getElementById('apiKey');
let imageBase64=null;

fileInput.addEventListener('change',(e)=>{
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=(event)=>{
const img=new Image();
img.onload=()=>{
const canvas=document.createElement('canvas');
const MAX_SIZE=1024;
let w=img.width,h=img.height;
if(w>h&&w>MAX_SIZE){h=h*(MAX_SIZE/w);w=MAX_SIZE;}
else if(h>MAX_SIZE){w=w*(MAX_SIZE/h);h=MAX_SIZE;}
canvas.width=w;canvas.height=h;
canvas.getContext('2d').drawImage(img,0,0,w,h);
const resized=canvas.toDataURL('image/jpeg',0.85);
imageBase64=resized.split(',')[1];
preview.innerHTML='<img src="'+resized+'">';
analyzeBtn.disabled=false;
errorBox.classList.remove('show');
};
img.src=event.target.result;
};
reader.readAsDataURL(file);
});

analyzeBtn.addEventListener('click',async()=>{
const apiKey=apiKeyInput.value.trim();
if(!apiKey){showError('لطفاً API Key را وارد کنید');return;}
if(!imageBase64){showError('لطفاً تصویر چارت را آپلود کنید');return;}

loading.classList.add('show');
result.classList.remove('show');
errorBox.classList.remove('show');
analyzeBtn.disabled=true;

try{
const prompt='تو یک تریدر حرفه‌ای سبک ICT/SMC هستی. این چارت را تحلیل کن.\n\nقوانین:\n1. روند اصلی را از EMA 200 تشخیص بده\n2. CHOCH و FVG را پیدا کن\n3. POC و نقدینگی را در نظر بگیر\n4. اگر همه تاییدیه‌ها جمع بود، سیگنال بده\n5. اگر مطمئن نیستی، NO_TRADE بده\n\nخروجی را فقط به این فرمت JSON بده (بدون هیچ متن اضافی):\n{\n  "signal": "BUY" یا "SELL" یا "NO_TRADE",\n  "entry": عدد قیمت,\n  "stop_loss": عدد قیمت,\n  "take_profit": عدد قیمت,\n  "confidence": عدد بین 0 تا 100,\n  "reason": "توضیح کوتاه فارسی"\n}';

const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+apiKey,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
contents:[{
parts:[
{text:prompt},
{inline_data:{mime_type:"image/jpeg",data:imageBase64}}
]
}],
generationConfig:{temperature:0.3,maxOutputTokens:500}
})
});

const data=await response.json();
console.log('Gemini Response:',data);

if(data.error){
throw new Error('خطای API: '+data.error.message);
}

if(!data.candidates||!data.candidates[0]||!data.candidates[0].content){
throw new Error('پاسخ AI خالی بود. VPN یا API Key را چک کنید.');
}

const text=data.candidates[0].content.parts[0].text;
console.log('AI Text:',text);

const jsonMatch=text.match(/\{[\s\S]*\}/);
if(!jsonMatch){
throw new Error('پاسخ AI فرمت JSON نداشت. متن: '+text.substring(0,150));
}

const analysis=JSON.parse(jsonMatch[0]);
showResult(analysis);

}catch(error){
console.error('Error:',error);
showError(error.message);
}finally{
loading.classList.remove('show');
analyzeBtn.disabled=false;
}
});

function showResult(data){
const signalEl=document.getElementById('signal');
signalEl.textContent=data.signal||'NO_TRADE';
signalEl.className='signal '+(data.signal||'no-trade').toLowerCase().replace('_','-');
document.getElementById('entry').textContent=data.entry||'-';
document.getElementById('stopLoss').textContent=data.stop_loss||'-';
document.getElementById('takeProfit').textContent=data.take_profit||'-';
document.getElementById('confidence').textContent=(data.confidence||0)+'%';
document.getElementById('reason').textContent=data.reason||'-';
result.classList.add('show');
}

function showError(msg){
errorBox.textContent='❌ '+msg;
errorBox.classList.add('show');
}
</script>
</body>
</html>
