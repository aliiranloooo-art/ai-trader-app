<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trader</title>
<style>
body{background:#0a0e17;color:#fff;font-family:Tahoma;padding:20px;margin:0}
.container{max-width:500px;margin:0 auto}
h1{color:#4ade80;text-align:center}
.upload-box{border:2px dashed #4ade80;border-radius:15px;padding:40px;text-align:center;cursor:pointer;margin:20px 0}
.upload-box input{display:none}
.btn{width:100%;padding:15px;background:#4ade80;color:#0a0e17;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:disabled{background:#333;color:#666}
.result{margin-top:20px;padding:20px;background:#1a1f2e;border-radius:15px;border:1px solid #4ade80;display:none}
.result.show{display:block}
.signal{text-align:center;font-size:28px;font-weight:bold;margin-bottom:15px}
.signal.buy{color:#4ade80}
.signal.sell{color:#ef4444}
.signal.no-trade{color:#fbbf24}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a2f3e}
.label{color:#888}
.value{color:#fff;font-weight:bold}
.loading{text-align:center;padding:20px;color:#4ade80;display:none}
.loading.show{display:block}
.api-input{width:100%;padding:12px;background:#1a1f2e;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:15px;font-size:14px}
.note{font-size:12px;color:#666;text-align:center;margin-top:10px}
img{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>🤖 AI Trader</h1>
<input type="password" id="apiKey" class="api-input" placeholder="Gemini API Key">
<div class="upload-box" onclick="document.getElementById('fileInput').click()">
<div style="font-size:48px">📸</div>
<div style="color:#4ade80">اسکرین‌شات چارت را آپلود کنید</div>
<input type="file" id="fileInput" accept="image/*">
</div>
<div id="preview"></div>
<button class="btn" id="analyzeBtn" disabled>تحلیل کن</button>
<div class="loading" id="loading">در حال تحلیل...</div>
<div class="result" id="result">
<div class="signal" id="signal"></div>
<div class="row"><span class="label">ورود:</span><span class="value" id="entry">-</span></div>
<div class="row"><span class="label">استاپ:</span><span class="value" id="stopLoss">-</span></div>
<div class="row"><span class="label">هدف:</span><span class="value" id="takeProfit">-</span></div>
<div class="row"><span class="label">اطمینان:</span><span class="value" id="confidence">-</span></div>
<div class="row"><span class="label">دلیل:</span><span class="value" id="reason">-</span></div>
</div>
<p class="note">⚠️ این ابزار فقط تحلیل می‌دهد</p>
</div>
<script>
const fileInput=document.getElementById('fileInput');
const preview=document.getElementById('preview');
const analyzeBtn=document.getElementById('analyzeBtn');
const loading=document.getElementById('loading');
const result=document.getElementById('result');
const apiKeyInput=document.getElementById('apiKey');
let imageBase64=null;

fileInput.addEventListener('change',(e)=>{
const file=e.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=(event)=>{
imageBase64=event.target.result.split(',')[1];
preview.innerHTML='<img src="'+event.target.result+'">';
analyzeBtn.disabled=false;
};
reader.readAsDataURL(file);
});

analyzeBtn.addEventListener('click',async()=>{
const apiKey=apiKeyInput.value.trim();
if(!apiKey){alert('API Key را وارد کنید');return;}
if(!imageBase64){alert('تصویر را آپلود کنید');return;}
loading.classList.add('show');
result.classList.remove('show');
analyzeBtn.disabled=true;

try{
const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+apiKey,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
contents:[{
parts:[
{text:'تو یک تریدر حرفه‌ای سبک ICT هستی. این چارت را تحلیل کن و فقط JSON بده: {"signal":"BUY" یا "SELL" یا "NO_TRADE","entry":عدد,"stop_loss":عدد,"take_profit":عدد,"confidence":0-100,"reason":"توضیح کوتاه"}'},
{inline_data:{mime_type:"image/png",data:imageBase64}}
]
}]
})
});
const data=await response.json();
const text=data.candidates[0].content.parts[0].text;
const jsonMatch=text.match(/\{[\s\S]*\}/);
if(!jsonMatch)throw new Error('پاسخ معتبر نبود');
const analysis=JSON.parse(jsonMatch[0]);
showResult(analysis);
}catch(error){
alert('خطا: '+error.message);
}finally{
loading.classList.remove('show');
analyzeBtn.disabled=false;
}
});

function showResult(data){
const signalEl=document.getElementById('signal');
signalEl.textContent=data.signal;
signalEl.className='signal '+data.signal.toLowerCase().replace('_','-');
document.getElementById('entry').textContent=data.entry||'-';
document.getElementById('stopLoss').textContent=data.stop_loss||'-';
document.getElementById('takeProfit').textContent=data.take_profit||'-';
document.getElementById('confidence').textContent=(data.confidence||0)+'%';
document.getElementById('reason').textContent=data.reason||'-';
result.classList.add('show');
}
</script>
</body>
</html>
